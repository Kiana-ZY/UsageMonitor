feature: 2026-05-08-cli-entry
created: 2026-05-08

steps:
  - action: "Cargo 配置：workspace root Cargo.toml 加 clap/toml/serde 依赖 + 引用 usage-monitor-core"
    exit_signal: "cargo check 通过，依赖全部解析"
    status: done

  - action: "CLI 结构：实现 Cli + Command enum + 三个 handler 占位"
    exit_signal: "cargo run -- --help 输出三个子命令；cargo run -- serve|tui|scan 各打印占位消息"
    status: done

  - action: "配置加载：实现 Config struct + load_config()"
    exit_signal: "无配置时静默默认；错误配置打印 warning；正确配置反序列化成功"
    status: done

  - action: "校验与收尾：clippy + cargo test + cargo run 全验证"
    exit_signal: "clippy 0 warn，所有验收场景手动验证通过"
    status: done

checks:
