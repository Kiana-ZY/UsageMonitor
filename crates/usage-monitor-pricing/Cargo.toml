[package]
name = "usage-monitor-pricing"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UsageMonitor model pricing engine — LiteLLM + OpenRouter + fuzzy matching"

[dependencies]
usage-monitor-core = { path = "../usage-monitor-core" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2", features = ["json"] }
