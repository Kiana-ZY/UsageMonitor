<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UsageMonitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4"></script>
<style>
:root {
  --bg:#0d1117; --surface:#161b22; --border:#30363d; --muted:#8b949e;
  --dim:#484f58; --text:#e6edf3; --accent:#58a6ff; --green:#3fb950;
  --purple:#bc8cff; --orange:#d2991d; --red:#f85149;
  --grade0:#161b22;--grade1:#0e4429;--grade2:#006d32;--grade3:#26a641;--grade4:#39d353;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-y:auto;line-height:1.5}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.header-l{display:flex;align-items:center;gap:10px}
.header h1{font-size:17px;font-weight:600;letter-spacing:-.3px}
.header .ver{font-size:11px;color:var(--dim);background:var(--bg);padding:2px 7px;border-radius:8px;border:1px solid var(--border)}
.header-r{display:flex;align-items:center;gap:10px}
.btn{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s;font-family:inherit}
.btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-p{background:#238636;border-color:#238636;color:#fff}
.btn-p:hover{background:#2ea043}
.status{font-size:12px;color:var(--muted)}
.content{max-width:1280px;margin:0 auto;padding:20px 28px 48px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 18px;transition:border-color .2s}
.stat:hover{border-color:var(--dim)}
.stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}
.stat .v{font-size:24px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.stat .s{font-size:11px;color:var(--dim);margin-top:1px}
.stat.hl .v{color:var(--green)}
.stat.ac .v{color:var(--accent)}
/* section */
.sec{margin-bottom:20px}
.sec-t{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px}
.card-t{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
/* rows */
.row{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:10px}
/* heatmap */
.heatmap-wrap{overflow-x:auto;padding-bottom:4px}
#heatmap{display:block}
/* table */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-height:400px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:500px}
th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);color:var(--muted);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:9px 10px;border-bottom:1px solid rgba(48,54,61,0.5)}
tr:hover td{background:rgba(255,255,255,0.02)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:"JetBrains Mono","Cascadia Code",monospace;font-size:11px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:500}
.b-claude{background:rgba(88,166,255,0.15);color:var(--accent)}
.b-codex{background:rgba(188,140,255,0.15);color:var(--purple)}
.b-kimi{background:rgba(210,153,29,0.15);color:var(--orange)}
.b-cc{background:rgba(63,185,80,0.12);color:var(--green)}
.b-native{background:rgba(139,148,158,0.12);color:var(--muted)}
/* date picker */
.date-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.date-bar .chip{font-size:11px;padding:4px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .15s}
.date-bar .chip:hover,.date-bar .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* tooltip */
.ttip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:12px;z-index:200;display:none;box-shadow:0 8px 24px rgba(0,0,0,0.4)}
/* anim */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .35s ease-out backwards}
.fade:nth-child(1){animation-delay:0s}.fade:nth-child(2){animation-delay:.05s}
.fade:nth-child(3){animation-delay:.1s}.fade:nth-child(4){animation-delay:.15s}
.fade:nth-child(5){animation-delay:.2s}.fade:nth-child(6){animation-delay:.25s}
.fade:nth-child(7){animation-delay:.3s}.fade:nth-child(8){animation-delay:.35s}
@keyframes count{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:blur(0)}}
.count-in{animation:count .4s ease-out}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.content{padding:14px}}
@media(max-width:560px){.stats{grid-template-columns:1fr}.header{padding:10px 14px}}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}
</style>
</head>
<body>
<div class="header">
  <div class="header-l"><h1>UsageMonitor</h1><span class="ver">v0.1.0</span></div>
  <div class="header-r">
    <span class="status" id="status">Ready</span>
    <button class="btn btn-p" onclick="doScan()">Scan</button>
    <button class="btn" onclick="location.reload()">Refresh</button>
  </div>
</div>

<div class="content">
  <!-- Stats -->
  <div class="stats" id="stats"></div>

  <!-- Chart + Heatmap -->
  <div class="row">
    <div class="card">
      <div class="card-t">Daily Usage</div>
      <div class="date-bar" id="dateBar">
        <span class="chip on" data-d="7">7d</span><span class="chip" data-d="30">30d</span><span class="chip" data-d="90">90d</span><span class="chip" data-d="365">1y</span><span class="chip" data-d="all">All</span>
      </div>
      <div style="position:relative;height:260px"><canvas id="dailyChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-t">Contribution Heatmap</div>
      <div class="heatmap-wrap"><canvas id="heatmap" height="120"></canvas></div>
      <div id="heatmapLegend" style="display:flex;justify-content:flex-end;align-items:center;gap:2px;margin-top:6px;font-size:10px;color:var(--dim)">
        Less<span style="width:10px;height:10px;background:var(--grade0);border-radius:2px;margin:0 2px"></span><span style="width:10px;height:10px;background:var(--grade1);border-radius:2px"></span><span style="width:10px;height:10px;background:var(--grade2);border-radius:2px"></span><span style="width:10px;height:10px;background:var(--grade3);border-radius:2px"></span><span style="width:10px;height:10px;background:var(--grade4);border-radius:2px"></span>More
      </div>
    </div>
  </div>

  <!-- Models -->
  <div class="sec">
    <div class="card">
      <div class="card-t">Models</div>
      <div class="tbl-wrap" id="modelsTbl"></div>
    </div>
  </div>

  <!-- Sessions -->
  <div class="sec">
    <div class="card">
      <div class="card-t">Recent Sessions</div>
      <div class="tbl-wrap" id="sessionsTbl"></div>
    </div>
  </div>
</div>

<div class="ttip" id="ttip"></div>

<script>
const fmt=n=>{if(Math.abs(n)>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(0)+'K';return String(n)};
const fmtPct=n=>(n*100).toFixed(1)+'%';
const fmtUSD=n=>'$'+n.toFixed(2);

let dailyChart, heatmapData=[], allModels=[], allDaily=[], selectedDays=7;

// ── Load ──
async function load(){
  try{
    const[sum,mods,ses,daily,hm]=await Promise.all([
      fetch('/api/summary').then(r=>r.json()),
      fetch('/api/models').then(r=>r.json()),
      fetch('/api/sessions').then(r=>r.json()),
      fetch('/api/daily').then(r=>r.json()),
      fetch('/api/heatmap').then(r=>r.json()),
    ]);
    allModels=mods;allDaily=daily;heatmapData=hm;
    renderStats(sum,mods);
    renderDaily(daily.slice(-selectedDays===-1?undefined:-selectedDays));
    renderHeatmap(hm);
    renderModels(mods);
    renderSessions(ses);
    document.getElementById('status').textContent=`${fmt(sum.message_count)} msgs · ${fmtPct(sum.cache_hit_rate)} CHR`;
  }catch(e){document.getElementById('status').textContent='Error: '+e.message}
}

// ── Stats cards ──
function renderStats(sum,mods){
  let inp=0,out=0,cr=0,cw=0,cost=0;
  mods.forEach(m=>{inp+=m.input;out+=m.output;cr+=m.cache_read;cw+=m.cache_write||0;cost+=m.estimated_cost||0});
  const total=inp+out+cw;
  const chr=inp+cr>0?cr/(inp+cr):0;
  const cards=[
    {l:'Total Cost',v:fmtUSD(cost),cls:'hl',s:'estimated'},
    {l:'Total Tokens',v:fmt(total),s:'input+output+cache write'},
    {l:'Cache Hit Rate',v:fmtPct(chr),cls:'ac',s:'cache_read / total'},
    {l:'Input',v:fmt(inp),s:''},
    {l:'Output',v:fmt(out),s:''},
    {l:'Cache Read',v:fmt(cr),cls:'hl',s:'tokens saved'},
    {l:'Models',v:mods.length,s:`${sum.tool_count} tools`},
    {l:'Messages',v:fmt(sum.message_count),s:'total requests'},
  ];
  document.getElementById('stats').innerHTML=cards.map((c,i)=>`<div class="stat fade ${c.cls||''}"><div class="l">${c.l}</div><div class="v count-in">${c.v}</div><div class="s">${c.s}</div></div>`).join('');
}

// ── Chart ──
function renderDaily(data){
  const ctx=document.getElementById('dailyChart').getContext('2d');
  if(dailyChart)dailyChart.destroy();
  dailyChart=new Chart(ctx,{
    type:'bar',
    data:{
      labels:data.map(d=>{const dt=new Date(d.date+'T00:00');return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'})}),
      datasets:[
        {label:'Input',data:data.map(d=>d.input),backgroundColor:'#58a6ff',borderRadius:2,borderSkipped:false},
        {label:'Output',data:data.map(d=>d.output),backgroundColor:'#bc8cff',borderRadius:2,borderSkipped:false},
        {label:'Cache Read',data:data.map(d=>d.cache_read),backgroundColor:'#3fb950',borderRadius:2,borderSkipped:false},
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{labels:{color:'#8b949e',font:{size:11},usePointStyle:true,pointStyleWidth:8,padding:16}},
        tooltip:{backgroundColor:'#161b22',borderColor:'#30363d',borderWidth:1,titleColor:'#e6edf3',bodyColor:'#8b949e'}
      },
      scales:{
        x:{ticks:{color:'#484f58',font:{size:10},maxTicksLimit:15},grid:{color:'#21262d'}},
        y:{ticks:{color:'#484f58',font:{size:10},callback:v=>fmt(v)},grid:{color:'#21262d'},beginAtZero:true}
      }
    }
  });
}

// ── GitHub-style heatmap (Canvas) ──
function renderHeatmap(data){
  const canvas=document.getElementById('heatmap');
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const CELL=12,GAP=3,LM=28,TM=18,RM=8,BM=4;
  const COLS=53,ROWS=7;

  // Build map
  const map={};let maxV=0;
  data.forEach(d=>{map[d.date]=d.input+d.output;if(map[d.date]>maxV)maxV=map[d.date]});
  if(maxV===0)maxV=1;

  // Fill grid: last 53 weeks
  const today=new Date();today.setHours(0,0,0,0);
  const endDay=new Date(today);
  endDay.setDate(endDay.getDate()-endDay.getDay()); // last Sunday
  const startDay=new Date(endDay);
  startDay.setDate(startDay.getDate()-COLS*7+1);

  const grid=[]; // [col][row]
  for(let c=0;c<COLS;c++){grid[c]=new Array(ROWS).fill(0)}
  const d=new Date(startDay);
  for(let c=0;c<COLS;c++){
    for(let r=0;r<ROWS;r++){
      const ds=d.toISOString().slice(0,10);
      grid[c][r]=map[ds]||0;
      d.setDate(d.getDate()+1);
    }
  }

  const W=LM+COLS*(CELL+GAP)-GAP+RM;
  const H=TM+ROWS*(CELL+GAP)-GAP+BM;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.scale(dpr,dpr);

  // bg
  ctx.fillStyle='#161b22';ctx.fillRect(0,0,W,H);

  // month labels
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let lastM=-1;
  ctx.fillStyle='#8b949e';ctx.font='10px system-ui';
  for(let c=0;c<COLS;c++){
    d.setTime(startDay.getTime());d.setDate(d.getDate()+c*7);
    const m=d.getMonth();
    if(m!==lastM){ctx.fillText(months[m],LM+c*(CELL+GAP),TM-4);lastM=m}
  }

  // day labels
  const days=['','Mon','','Wed','','Fri',''];
  for(let r=0;r<ROWS;r++){
    if(days[r]){ctx.fillStyle='#8b949e';ctx.font='9px system-ui';ctx.textAlign='right';ctx.fillText(days[r],LM-4,TM+r*(CELL+GAP)+CELL-2)}
  }

  // cells
  function grade(v){
    if(v===0)return'#161b22';
    const p=v/maxV;
    if(p<0.25)return'#0e4429';if(p<0.5)return'#006d32';if(p<0.75)return'#26a641';return'#39d353';
  }
  for(let c=0;c<COLS;c++){
    for(let r=0;r<ROWS;r++){
      const x=LM+c*(CELL+GAP),y=TM+r*(CELL+GAP);
      ctx.fillStyle=grade(grid[c][r]);
      ctx.beginPath();ctx.roundRect(x,y,CELL,CELL,3);ctx.fill();
    }
  }
  ctx.textAlign='start';
}

// ── Models table ──
function renderModels(models){
  document.getElementById('modelsTbl').innerHTML=`<table>
    <thead><tr><th>Model</th><th class="num">Input</th><th class="num">Output</th><th class="num">Cache Read</th><th class="num">Cache Write</th><th class="num">Sessions</th><th class="num">Requests</th><th class="num">Est. Cost</th></tr></thead>
    <tbody>${models.map(m=>`<tr>
      <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${m.model_id}">${m.model_id}</td>
      <td class="num">${fmt(m.input)}</td><td class="num">${fmt(m.output)}</td>
      <td class="num" style="color:var(--green)">${fmt(m.cache_read)}</td><td class="num">${fmt(m.cache_write||0)}</td>
      <td class="num">${m.sessions}</td><td class="num">${m.requests}</td>
      <td class="num" style="font-weight:600">${fmtUSD(m.estimated_cost||0)}</td>
    </tr>`).join('')}</tbody></table>`;
}

// ── Sessions table ──
function renderSessions(sessions){
  document.getElementById('sessionsTbl').innerHTML=`<table>
    <thead><tr><th>Session</th><th>Client</th><th>Model</th><th class="num">Input</th><th class="num">Output</th><th class="num">Cache</th><th class="num">Msgs</th><th class="num">Cost</th></tr></thead>
    <tbody>${sessions.slice(0,50).map(s=>`<tr>
      <td><span class="mono" style="color:var(--accent)">${s.session_id.slice(0,8)}</span></td>
      <td><span class="badge b-${s.client}">${s.client}</span></td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${s.model_id}">${s.model_id}</td>
      <td class="num">${fmt(s.input)}</td><td class="num">${fmt(s.output)}</td>
      <td class="num" style="color:var(--green)">${fmt(s.cache_read)}</td>
      <td class="num">${s.messages}</td>
      <td class="num" style="font-weight:500">${fmtUSD(s.estimated_cost||0)}</td>
    </tr>`).join('')}</tbody></table>`;
}

// ── Scan ──
async function doScan(){
  document.getElementById('status').textContent='Scanning…';
  try{const r=await fetch('/api/scan',{method:'POST'});const d=await r.json();document.getElementById('status').textContent=`Scanned ${d.total} msgs (${d.inserted} new)`;setTimeout(load,600)}
  catch(e){document.getElementById('status').textContent='Scan failed'}
}

// ── Date chips ──
document.getElementById('dateBar').addEventListener('click',e=>{
  if(!e.target.classList.contains('chip'))return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  e.target.classList.add('on');
  const d=e.target.dataset.d;
  selectedDays=d==='all'?-1:parseInt(d);
  renderDaily(allDaily.slice(selectedDays===-1?0:-selectedDays));
});

load();
</script>
</body>
</html>
